<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dziękujemy | The Noise Makers</title>
<link rel="icon" type="image/png" href="assets/img/logo/sygnet-red-square.png">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/fjh4kwb.css">
<link rel="stylesheet" href="assets/demo.css">







<style>
.ty-wrap{min-height:52vh;display:flex;align-items:center;justify-content:center;padding:48px 0}
.ty-card{max-width:640px;width:100%;background:#fff;border:1.5px solid rgba(46,46,46,.16);border-top:5px solid #e10800;padding:44px 40px;text-align:left}
.ty-card h1{margin:0 0 14px;font-size:clamp(26px,4vw,36px);line-height:1.15}
.ty-card p{margin:0 0 12px;font-size:16.5px;line-height:1.55;color:#2e2e2e}
.ty-card .muted{color:#8a8276;font-size:14px}
.ty-card .btn{margin-top:18px}
.ty-feel{display:block;margin-top:26px;font-weight:700;color:#2e2e2e}
.ty-feel .art{color:#e10800}
@media(max-width:520px){.ty-card{padding:30px 22px}}







.tyx{display:flex;align-items:stretch;min-height:420px;max-width:1043px;width:100%;background:#fff;
  border:1.5px solid rgba(46,46,46,.16);border-top:5px solid #e10800;overflow:hidden}
.tyx__media{position:relative;flex:0 0 46%;min-height:320px;background:#161616;overflow:hidden}
.tyx__bg{position:absolute;inset:0;background-position:center 30%;background-size:cover;background-repeat:no-repeat;
  filter:grayscale(1) contrast(1.02)}
.tyx__media::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}
.tyx__logo{position:absolute;top:22px;left:22px;z-index:1;width:64px;height:64px;display:block}
.tyx__logo img{width:100%;height:100%;object-fit:contain;display:block}
.tyx__body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:clamp(28px,4vw,48px) clamp(22px,3.5vw,44px)}
.tyx__title{margin:0;font-size:clamp(26px,2.6vw,38px);line-height:1.1;letter-spacing:-.015em}
.tyx__text{display:flex;flex-direction:column;gap:12px}
.tyx__text p{margin:0;font-size:16.5px;line-height:1.55;color:#2e2e2e}
@media(max-width:860px){
  .tyx{flex-direction:column;max-width:560px}
  .tyx__media{flex:none;order:2;min-height:240px}
}
</style>
</head>
<body>
<div class="page">
  <header class="demo-nav">
    <span class="demo-nav__logo"><img src="assets/img/figma/logo-tnm-white.png" alt="The Noise Makers"></span>
    <span class="demo-nav__right">

<a class="demo-nav__back" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Strona główna</span></a></span>
  </header>

  <main class="wrap">
    <div class="container ty-wrap">
      






      <div class="ty-card" id="ty-card">
        <h1>Dziękujemy.</h1>
        <p>Jesteśmy w kontakcie - wszystko, co potrzebne, wysyłamy na Twój adres e-mail.</p>
        <p>Jeśli nie widzisz wiadomości, zajrzyj do folderu SPAM albo napisz na <a href="mailto:jestem@thenoisemakers.pl">jestem@thenoisemakers.pl</a>.</p>
        <span class="ty-feel">feel the he<span class="art">ART</span></span>
      </div>
    </div>
  </main>

  <footer class="demo-foot"><span class="feel">feel the he<span class="art">ART</span></span></footer>
</div>

 
<script src="assets/js/flags.js?v=20260902"></script>
<script src="assets/js/consent.js?v=20260911"></script>
<script src="assets/js/track.js?v=20260911"></script>
<script src="assets/js/pixel.js?v=20260902e5"></script>
<script src="assets/js/gtm.js?v=20260911"></script>
<script>
(function(){
  "use strict";
  var qp = new URLSearchParams(location.search);
  







  var checkout = qp.get("checkout");
  var sid = qp.get("session_id") || "";
  

  

  








  var W_OK = { feedback: 1, polkolonie: 1, wracam: 1, "dni-probne": 1, diagnostyka: 1, nowi: 1 };
  var w = W_OK[qp.get("w")] ? qp.get("w") : null;
  






















  var EN    = /^\/en\//.test(location.pathname);
  var KONF  = EN ? "/en/konfigurator.html" : "/konfigurator";
  var HOME  = EN ? "/en/index.html" : "/";
  var DP = (w === "dni-probne");
  var DP_URL = EN ? "/en/trial-days" : "/dni-probne";
  var backUrl = DP ? DP_URL : (w ? (KONF + "?k=" + w) : KONF);
  var backLabel = DP ? "Wróć do Dni Próbnych " : "Wróć do konfiguratora ";
  


  var KOSZYK_KEY = "tnm_koszyk_v1";
  function koszykWyczysc() { try { localStorage.removeItem(KOSZYK_KEY); } catch (e) {} }
  if (checkout === "success" || qp.get("reserved") === "1") koszykWyczysc();
  var restoreUrl = DP ? DP_URL : backUrl + (backUrl.indexOf("?") >= 0 ? "&" : "?") + "restore=1";
  



  (function () {
    var home = document.querySelector(".demo-nav__back");
    if (home) home.setAttribute("href", HOME);
  })();
  var ARR = '<span aria-hidden="true">&rsaquo;</span>';
  var html = null;
  var reserved = qp.get("reserved") === "1";
  

  if (window.TNMTrack) { try { TNMTrack("checkout_return", { status: (checkout === "cancel") ? "cancel" : (reserved ? "reserved" : (checkout === "success" ? "success" : "neutral")), has_session_id: !!sid, variant: w || null }); } catch (e) {} }
  if (checkout !== "cancel" && reserved) {
    html = '<h1>Rezerwacje przyjęte. Dziękujemy!</h1>'
      + '<p>Zapisaliśmy Twoje chęci - bez żadnej płatności dziś. Odezwiemy się, gdy ruszą zapisy na wybrane zajęcia.</p>'
      + (w ? '<a class="btn" href="' + backUrl + '">' + backLabel + ARR + '</a>' : '')
      + '<span class="ty-feel">feel the he<span class="art">ART</span></span>';
  } else if (checkout === "success") {
    





    var diag = false;
    try { diag = !!(JSON.parse(sessionStorage.getItem("tnm_last_order") || "{}") || {}).diagnostyka; } catch (e) {}
     
    var TYX_COPY_WSPOLNE = {
      title: 'Dzi\u0119kujemy za Twoje zam\u00f3wienie<br>i cieszymy si\u0119, \u017ce Jeste\u015b.',
      paras: [
        'Twoje zam\u00f3wienie jest ju\u017c u nas.<br>Dzi\u0119kujemy za dokonany wyb\u00f3r zaj\u0119\u0107.',
        'W nast\u0119pnym kroku wr\u00f3cimy do Ciebie z propozycjami i terminami uwzgl\u0119dniaj\u0105cymi Twoje potrzeby.',
        'W sytuacji rezerwacji zaj\u0119\u0107 grupowych oraz zespo\u0142owych, wr\u00f3cimy do Ciebie w pierwszej kolejno\u015bci gdy tylko pojawi\u0105 si\u0119 dost\u0119pne terminy i grafiki.<br>Znajdziemy dla Ciebie pasuj\u0105c\u0105 opcj\u0119.',
        'Cieszymy si\u0119, \u017ce ju\u017c wkr\u00f3tce rozpoczniemy wsp\u00f3ln\u0105 przygod\u0119 pe\u0142n\u0105 pasji, rado\u015bci i satysfakcji.<br>A przede wszystkim, wzbogacaj\u0105cych relacji.',
        'Do zobaczenia,<br>Zesp\u00f3\u0142 The Noise Makers'
      ]
    };
     
    var TYX_COPY_DP = {
      title: 'Dzi\u0119kujemy za rezerwacj\u0119 wst\u0119pu<br>i cieszymy si\u0119, \u017ce si\u0119 poznamy.',
      paras: [
        'Twoje miejsce na zaj\u0119ciach pr\u00f3bnych jest ju\u017c zarezerwowane.',
        'Na Tw\u00f3j adres e-mail wysy\u0142amy potwierdzenie z lokalizacj\u0105 i szczeg\u00f3\u0142ami organizacyjnymi.',
        'Do zobaczenia,<br>Zesp\u00f3\u0142 The Noise Makers'
      ]
    };
    var TYX_COPY = { feedback: TYX_COPY_WSPOLNE, polkolonie: TYX_COPY_WSPOLNE, wracam: TYX_COPY_WSPOLNE, "dni-probne": TYX_COPY_DP };
    var c = TYX_COPY[w] || TYX_COPY_WSPOLNE;
    var extra = '';
    if (diag) extra += '<p><b>Diagnostyka:</b> termin um\u00f3wisz linkiem do kalendarza, kt\u00f3ry wy\u015blemy Ci mailem. Nie musisz nic robi\u0107, odezwiemy si\u0119 pierwsi.</p>';
    if (sid) extra += '<p class="muted" style="margin-top:10px">Nr operacji: ' + sid.replace(/[^\w-]/g, "").slice(0, 28) + '&hellip;</p>';
    var tyx = '<div class="tyx">'
      + '<div class="tyx__media"><span class="tyx__bg" style="background-image:url(\'assets/img/figma/tnm-members.webp\')" aria-hidden="true"></span>'
      + '<span class="tyx__logo"><img src="assets/img/logo/sygnet-red-square-white.png" alt="The Noise Makers"></span></div>'
      + '<div class="tyx__body"><h1 class="tyx__title">' + c.title + '</h1>'
      + '<div class="tyx__text">' + c.paras.map(function (t) { return '<p>' + t + '</p>'; }).join('') + extra + '</div>'
      + '</div></div>';
    document.getElementById("ty-card").outerHTML = tyx;
    html = false;  
  } else if (checkout === "cancel") {
    html = '<h1>Płatność nie została dokończona.</h1>'
      + '<p>Nic straconego - Twój koszyk czeka. Możesz wrócić i dokończyć zakup w każdej chwili.</p>'
      + '<a class="btn" href="' + restoreUrl + '">' + (DP ? 'Wracam do Dni Pr\u00f3bnych ' : 'Wracam do konfiguratora ') + ARR + '</a>'
      + '<p class="muted" style="margin-top:16px">Coś nie działa? Napisz na jestem@thenoisemakers.pl - pomożemy.</p>';
  }
  

  if (html === false) {   } else if (html === null) {
    var card = document.getElementById("ty-card");
    var back = document.createElement("p");
    back.innerHTML = '<a class="btn" href="' + backUrl + '">' + backLabel + ARR + '</a>';
    var feel = card.querySelector(".ty-feel");
    if (feel) card.insertBefore(back, feel); else card.appendChild(back);
  } else {
    document.getElementById("ty-card").innerHTML = html;
  }
})();
</script>
</body>
</html>
